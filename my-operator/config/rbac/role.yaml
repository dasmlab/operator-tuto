---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - tutos.dasmlab.org
  resources:
  - deployercrds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tutos.dasmlab.org
  resources:
  - deployercrds/finalizers
  verbs:
  - update
- apiGroups:
  - tutos.dasmlab.org
  resources:
  - deployercrds/status
  verbs:
  - get
  - patch
  - update
